<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: transparent; overflow-y: auto; height: 100vh; }
    </style>
</head>
<body class="custom-scrollbar">
    <div class="product-grid">
        <!-- Coffee -->
        <div class="product-card" onclick="addToCart('เอสเพรสโซ่', 50, '/public/images/lux_coffee_hero.png')">
            <div class="product-img-wrapper"><img src="/public/images/lux_coffee_hero.png"></div>
            <div class="product-info">
                <div class="product-name font-serif italic">เอสเพรสโซ่ ช็อตเดียว</div>
                <div class="product-price">50 บาท</div>
            </div>
        </div>
        <div class="product-card" onclick="addToCart('ลาเต้ อาร์ทิซาน', 65, '/public/images/artisan_coffee_1.png')">
            <div class="product-img-wrapper"><img src="/public/images/artisan_coffee_1.png"></div>
            <div class="product-info">
                <div class="product-name font-serif italic">ลาเต้ อาร์ทิซาน</div>
                <div class="product-price">65 บาท</div>
            </div>
        </div>
        <div class="product-card" onclick="addToCart('อเมริกาโน่ น้ำผึ้ง', 60, 'https://images.unsplash.com/photo-1551033406-611cf9a28f67?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper"><img src="https://images.unsplash.com/photo-1551033406-611cf9a28f67?auto=format&fit=crop&q=80&w=400"></div>
            <div class="product-info">
                <div class="product-name font-serif italic">อเมริกาโน่ น้ำผึ้ง</div>
                <div class="product-price">60 บาท</div>
            </div>
        </div>

        <!-- Bakery -->
        <div class="product-card" onclick="addToCart('ครัวซองต์เนยสด', 45, '/public/images/artisan_pastry_1.png')">
            <div class="product-img-wrapper"><img src="/public/images/artisan_pastry_1.png"></div>
            <div class="product-info">
                <div class="product-name font-serif italic">ครัวซองต์เนยสด</div>
                <div class="product-price">45 บาท</div>
            </div>
        </div>
        <div class="product-card" onclick="addToCart('อัลมอนด์ครัวซองต์', 65, 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper"><img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&q=80&w=400"></div>
            <div class="product-info">
                <div class="product-name font-serif italic">อัลมอนด์ครัวซองต์</div>
                <div class="product-price">65 บาท</div>
            </div>
        </div>

        <!-- Dessert -->
        <div class="product-card" onclick="addToCart('บานอฟฟี่ พาย', 80, 'https://images.unsplash.com/photo-1626354381535-2493739542f1?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper"><img src="https://images.unsplash.com/photo-1626354381535-2493739542f1?auto=format&fit=crop&q=80&w=400"></div>
            <div class="product-info">
                <div class="product-name font-serif italic">บานอฟฟี่ พาย</div>
                <div class="product-price">80 บาท</div>
            </div>
        </div>
        <div class="product-card" onclick="addToCart('เค้กมะพร้าวอ่อน', 95, 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper"><img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&q=80&w=400"></div>
            <div class="product-info">
                <div class="product-name font-serif italic">เค้กมะพร้าวอ่อน</div>
                <div class="product-price">95 บาท</div>
            </div>
        </div>

        <!-- Others -->
        <div class="product-card" onclick="addToCart('น้ำส้มคั้นสด', 65, 'https://images.unsplash.com/photo-1613478223719-2ab80260f423?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper"><img src="https://images.unsplash.com/photo-1613478223719-2ab80260f423?auto=format&fit=crop&q=80&w=400"></div>
            <div class="product-info">
                <div class="product-name font-serif italic">น้ำส้มคั้นสด</div>
                <div class="product-price">65 บาท</div>
            </div>
        </div>
        <div class="product-card" onclick="addToCart('ช็อกโกแลตพรีเมียม', 80, 'https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper"><img src="https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?auto=format&fit=crop&q=80&w=400"></div>
            <div class="product-info">
                <div class="product-name font-serif italic">ช็อกโกแลตพรีเมียม</div>
                <div class="product-price">80 บาท</div>
            </div>
        </div>
    </div>

    <script>
        function addToCart(name, price, image) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            let item = cart.find(i => i.name === name);
            if (item) {
                item.quantity += 1;
            } else {
                cart.push({ name, price, image, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            window.parent.postMessage('cartUpdated', '*');
        }
    </script>
</body>
</html>
