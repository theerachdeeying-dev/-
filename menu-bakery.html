<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: transparent; overflow-y: auto; height: 100vh; }
    </style>
</head>
<body class="custom-scrollbar">
    <div class="product-grid">
        <div class="product-card" onclick="addToCart('ครัวซองต์เนยสด', 45, '/public/images/artisan_pastry_1.png')">
            <div class="product-img-wrapper">
                <img src="/public/images/artisan_pastry_1.png">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">ครัวซองต์เนยสด</div>
                <div class="product-price">45 บาท</div>
            </div>
        </div>

        <div class="product-card" onclick="addToCart('มัฟฟินบลูเบอร์รี่', 50, 'https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper">
                <img src="https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&q=80&w=400">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">มัฟฟินบลูเบอร์รี่</div>
                <div class="product-price">50 บาท</div>
            </div>
        </div>

        <div class="product-card" onclick="addToCart('อัลมอนด์ครัวซองต์', 65, 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper">
                <img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&q=80&w=400">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">อัลมอนด์ครัวซองต์</div>
                <div class="product-price">65 บาท</div>
            </div>
        </div>

        <div class="product-card" onclick="addToCart('คานาเล่ วานิลลา', 60, 'https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper">
                <img src="https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?auto=format&fit=crop&q=80&w=400">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">คานาเล่ วานิลลา</div>
                <div class="product-price">60 บาท</div>
            </div>
        </div>
    </div>

    <script>
        function addToCart(name, price, image) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            let item = cart.find(i => i.name === name);
            if (item) {
                item.quantity += 1;
            } else {
                cart.push({ name, price, image, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            window.parent.postMessage('cartUpdated', '*');
        }
    </script>
</body>
</html>
