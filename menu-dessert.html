<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: transparent; overflow-y: auto; height: 100vh; }
    </style>
</head>
<body class="custom-scrollbar">
    <div class="product-grid">
        <div class="product-card" onclick="addToCart('บานอฟฟี่ พาย', 80, 'https://images.unsplash.com/photo-1626354381535-2493739542f1?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper">
                <img src="https://images.unsplash.com/photo-1626354381535-2493739542f1?auto=format&fit=crop&q=80&w=400">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">บานอฟฟี่ พาย</div>
                <div class="product-price">80 บาท</div>
            </div>
        </div>

        <div class="product-card" onclick="addToCart('เค้กแครอท', 90, 'https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper">
                <img src="https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?auto=format&fit=crop&q=80&w=400">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">เค้กแครอท</div>
                <div class="product-price">90 บาท</div>
            </div>
        </div>

        <div class="product-card" onclick="addToCart('เค้กมะพร้าวอ่อน', 95, 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper">
                <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&q=80&w=400">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">เค้กมะพร้าวอ่อน</div>
                <div class="product-price">95 บาท</div>
            </div>
        </div>

        <div class="product-card" onclick="addToCart('ยูซุ ชีสเค้ก', 85, 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper">
                <img src="https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&q=80&w=400">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">ยูซุ ชีสเค้ก</div>
                <div class="product-price">85 บาท</div>
            </div>
        </div>
    </div>

    <script>
        function addToCart(name, price, image) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            let item = cart.find(i => i.name === name);
            if (item) {
                item.quantity += 1;
            } else {
                cart.push({ name, price, image, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            window.parent.postMessage('cartUpdated', '*');
        }
    </script>
</body>
</html>
