<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: transparent; overflow-y: auto; height: 100vh; }
    </style>
</head>
<body class="custom-scrollbar">
    <div class="product-grid">
        <div class="product-card" onclick="addToCart('ชาร้อนออร์แกนิค', 55, 'https://images.unsplash.com/photo-1544787210-2211d1e86333?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper">
                <img src="https://images.unsplash.com/photo-1544787210-2211d1e86333?auto=format&fit=crop&q=80&w=400">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">ชาร้อนออร์แกนิค</div>
                <div class="product-price">55 บาท</div>
            </div>
        </div>

        <div class="product-card" onclick="addToCart('นมอัลมอนด์วนิลลา', 70, 'https://images.unsplash.com/photo-1550583724-1d66fe241122?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper">
                <img src="https://images.unsplash.com/photo-1550583724-1d66fe241122?auto=format&fit=crop&q=80&w=400">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">นมอัลมอนด์วนิลลา</div>
                <div class="product-price">70 บาท</div>
            </div>
        </div>

        <div class="product-card" onclick="addToCart('น้ำส้มคั้นสด', 65, 'https://images.unsplash.com/photo-1613478223719-2ab80260f423?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper">
                <img src="https://images.unsplash.com/photo-1613478223719-2ab80260f423?auto=format&fit=crop&q=80&w=400">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">น้ำส้มคั้นสด</div>
                <div class="product-price">65 บาท</div>
            </div>
        </div>

        <div class="product-card" onclick="addToCart('ช็อกโกแลตพรีเมียม', 80, 'https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?auto=format&fit=crop&q=80&w=400')">
            <div class="product-img-wrapper">
                <img src="https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?auto=format&fit=crop&q=80&w=400">
            </div>
            <div class="product-info">
                <div class="product-name font-serif italic">ช็อกโกแลตพรีเมียม</div>
                <div class="product-price">80 บาท</div>
            </div>
        </div>
    </div>

    <script>
        function addToCart(name, price, image) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            let item = cart.find(i => i.name === name);
            if (item) {
                item.quantity += 1;
            } else {
                cart.push({ name, price, image, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            window.parent.postMessage('cartUpdated', '*');
        }
    </script>
</body>
</html>
